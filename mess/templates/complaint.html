<!DOCTYPE html>
<html>
<head>
<title>Complaint</title>
{% load static %}

<style>
body{
margin:0;
display:flex;
font-family:'Segoe UI',sans-serif;
background:url("https://images.unsplash.com/photo-1490818387583-1baba5e638af") no-repeat center/cover;
}

.sidebar{
width:230px;
background:#0F172A;
height:100vh;
padding:25px;
color:white;
}

.sidebar a{
display:block;
padding:12px;
margin:8px 0;
color:#CBD5F5;
text-decoration:none;
}

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:rgba(255,255,255,0.15);
padding:40px;
border-radius:15px;
color:white;
width:400px;
}

textarea,select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
}

button{
margin-top:15px;
padding:10px;
background:#2563EB;
color:white;
border:none;
border-radius:6px;
}
  .a{
    color: black;
  }
</style>
</head>

<body>

<div class="sidebar">
<h2>Mess System</h2>
<a href="{% url 'home' %}">🏠 Home</a>
<a href="{% url 'menu' %}">🍛 Daily Menu</a>
<a href="{% url 'attendance' %}">📋 Meal Attendance</a>
<a href="{% url 'complaint' %}">⚠ Complaints</a>
<a href="{% url 'rating' %}">⭐ Food Rating</a>
<a href="{% url 'bill' %}">💰 Monthly Bill</a>

</div>

<div class="main">

<div class="card">

<h2 class ="a">Submit Complaint</h2>

<form method="POST">
    {% csrf_token %}
    <label>Food Quality</label>
    <select name="priority" required>
        <option value="" disabled selected>Select Quality</option>
        <option value="Poor">Poor</option>
        <option value="Average">Average</option>
        <option value="Good">Good</option>
        <option value="Excellent">Excellent</option>
    </select><br><br>
<label class="a">Complaint Message</label>
<textarea name="message" placeholder="Describe your issue clearly..." required></textarea>

    <button type="submit">Submit</button>
</form>

</div>

</div>

</body>
</html>
