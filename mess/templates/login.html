<!DOCTYPE html>
<html>
<head>

<title>Hostel Mess Login</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background: linear-gradient(120deg,#2b5876,#4e4376);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-box{
background:white;
padding:40px;
border-radius:10px;
width:350px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:25px;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Mess Login</h2>

<form method="POST">

{% csrf_token %}

<input type="text" name="username" class="form-control" placeholder="Admission Number / Username" required><br>

<input type="password" name="password" class="form-control" placeholder="Password" required><br>

<button class="btn btn-primary w-100">Login</button>

</form>

<br>

<p class="text-center">
New Student?
<a href="{% url 'register' %}">Register Here</a>
</p>

{% if error %}
<p style="color:red;text-align:center;">{{error}}</p>
{% endif %}

</div>

</body>
</html>
